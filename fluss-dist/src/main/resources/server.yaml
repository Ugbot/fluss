#==============================================================================
# Zookeeper
#==============================================================================

# Zookeeper connection string (see zookeeper docs for details).
# This is a comma separated host:port pairs, each corresponding to a zk
# server. e.g. "127.0.0.1:3000,127.0.0.1:3001,127.0.0.1:3002".
# You can also append an optional chroot string to the urls to specify the
# root directory for all Fluss znodes.
zookeeper.address: localhost:2181

#==============================================================================
# Common
#==============================================================================

# The default bucket number to be used when creating tables if no bucket number
# is specified for the table.
default.bucket.number: 1

# The default replication factor to be used when creating tables if no replication
# factor is specified for the table.
default.replication.factor: 1

# The local data directory to be used for Fluss to storing kv and log data.
data.dir: /tmp/fluss-data

# The remote data directory to be used for Fluss. Now, it is only used for storing
# kv snapshot data. Expected be set to a remote location like: oss://bucket/path for oss
# filesystem or hdfs://namenode:port/path for hdfs filesystem
remote.data.dir: /tmp/fluss-remote-data

#==============================================================================
# Listeners
#==============================================================================

# The network address and port to which the server binds for accepting connections.
# The format is '{listener_name}://{host}:{port}', and multiple addresses can be specified, separated by commas.
bind.listeners: FLUSS://localhost:9123


#==============================================================================
# Tablet Server
#==============================================================================


# The id of the tablet server to be run, must be set and should be different
# when running multiple tablet servers.
tablet-server.id: 0

# Controlled shutdown configuration for tablet servers
# tablet-server.controlled-shutdown.max-retries: 3
# tablet-server.controlled-shutdown.retry-interval: 1000ms

#==============================================================================
# Tiering Service
#==============================================================================

# The standalone tiering service is launched as a separate process with
# ./bin/tiering-service.sh start. It is NOT configured from this file; instead
# its configuration is supplied as "--key value" command-line parameters that
# are forwarded to TieringServiceMain. The keys below document the available
# daemon options (shown with their default values). Example invocation:
#
#   ./bin/tiering-service.sh start \
#       --fluss.bootstrap.servers localhost:9123 \
#       --datalake.format iceberg \
#       --datalake.iceberg.warehouse /tmp/iceberg-warehouse \
#       --tiering.poll.table.interval 30s \
#       --tiering.max-concurrent-tables 1 \
#       --tiering.poll.timeout 10s
#
# Parameter blocks:
#   fluss.*            Fluss client config; fluss.bootstrap.servers is mandatory.
#                      The fluss. prefix is stripped before use.
#   datalake.format    The target lake format (e.g. iceberg). Mandatory.
#   datalake.<format>.* Lake storage config (warehouse, catalog props, S3
#                      endpoint/region/credentials); prefix stripped.
#   lake.tiering.*     Forwarded verbatim to the lake committer.
#
# Daemon-specific options (passed within the fluss. block, e.g.
# --fluss.tiering.poll.table.interval ... is NOT required; pass them as plain
# --tiering.* parameters):
#   tiering.poll.table.interval   30s   Interval to request/heartbeat a tiering
#                                       table from the coordinator. Must stay well
#                                       under the coordinator's 2 minute timeout.
#   tiering.max-concurrent-tables  1    Number of tables tiered concurrently
#                                       (the worker pool size).
#   tiering.poll.timeout          10s   Timeout for a single log poll while
#                                       tiering a table's log splits.
#
# Optional JVM options for the tiering-service process can be set here and are
# picked up by ./bin/tiering-service.sh:
# env.java.opts.tiering-service: ""

#==============================================================================
# OSS FileSystem
#==============================================================================

# The configuration for oss filesystem when using oss as the remote data directory
# fs.oss.endpoint: xxx
# fs.oss.accessKeyId: xxx
# fs.oss.accessKeySecret: xxx
